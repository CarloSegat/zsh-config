<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Changes</title>
<style>
/* Layout: sticky header; sidebar index of changed passages beside one reading column. */
:root {
  --bg: #f7f7f4; --panel: #ffffff; --fg: #1d1f21; --muted: #6b6f73; --line: #dcdcd6;
  --accent: #2f5d8a; --ins: #1f7a4d; --ins-bg: #dff2e6; --del: #b03a2e; --del-bg: #f8e1de;
  --ok: #1f7a4d; --warn: #b7791f; --quote: #eef1f5;
  --read: "Iowan Old Style", "Charter", "Georgia", serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #16181b; --panel: #1e2125; --fg: #e4e4e0; --muted: #9a9ea3; --line: #33373c;
  --accent: #7fb0e0; --ins: #6fd39d; --ins-bg: #1d3a2b; --del: #f08a7e; --del-bg: #43231f;
  --ok: #6fd39d; --warn: #e3b25a; --quote: #262b31; color-scheme: dark;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--ui); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
header .grow { flex: 1; }
header label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
#banner { background: var(--warn); color: #000; border-radius: 6px; padding: 4px 10px; }
#banner button { margin-left: 8px; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
nav { position: sticky; top: 49px; height: calc(100vh - 49px); overflow: auto; border-right: 1px solid var(--line);
  padding: 12px 12px 40px; }
nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
nav a { display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; border-radius: 4px; color: var(--fg);
  text-decoration: none; font-size: 12.5px; }
nav a:hover, nav a.cur { background: var(--quote); }
nav a .where { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
nav a .gist { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); align-self: center; }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.open { background: var(--warn); border-color: var(--warn); }
main { padding: 16px max(16px, 3vw) 120px; min-width: 0; }
.file { max-width: 860px; margin: 0 auto 32px; }
.file > h2 { font: 600 13px var(--mono); color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.same { font: 15px/1.6 var(--read); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);
  margin: 10px 0; padding: 0 14px; }
.changes-only .same { display: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; scroll-margin-top: 64px; }
.card.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.ok { border-color: var(--ok); }
.card.fresh { animation: fresh 3s ease-out; }
@keyframes fresh { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
.card .head { display: flex; gap: 8px; align-items: center; padding: 7px 10px 7px 14px; border-bottom: 1px solid var(--line); }
.card .head .where { font: 12px var(--mono); color: var(--muted); flex: 1; }
.card .head .gist { display: none; color: var(--muted); font-size: 13px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.done .head .where { flex: none; }
.card.done .head .where, .card.done .head .gist { display: block; cursor: pointer; }
.card.done:not(.open) .text, .card.done:not(.open) .thread, .card.done:not(.open) .composer { display: none; }
.card.done:not(.open) .head { border-bottom: 0; }
.text { font: 15.5px/1.62 var(--read); white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px 14px; }
ins { text-decoration: none; background: var(--ins-bg); border-bottom: 2px solid var(--ins); }
del { background: var(--del-bg); color: var(--del); text-decoration: line-through; }
.hunk:not(.ok) { cursor: pointer; border-radius: 3px; }
.hunk:not(.ok):hover { outline: 1px solid var(--accent); outline-offset: 1px; }
.hunk.on { outline: 2px solid var(--accent); outline-offset: 1px; }
/* An approved change reads as the new text alone: plain, selectable text. */
.hunk.ok del, .hunk.ok .mark { display: none; }
.hunk.ok ins { background: none; border-bottom: 0; }
button { font: 12.5px var(--ui); border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: 5px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.approved { background: var(--ok); border-color: var(--ok); color: var(--bg); }
button:disabled { opacity: .5; cursor: not-allowed; }
.thread:empty { display: none; }
.thread { border-top: 1px solid var(--line); padding: 8px 14px 12px; display: grid; gap: 8px; }
.note { font-size: 13.5px; }
.note .who { font-weight: 600; margin-right: 6px; }
.note .who.claude { color: var(--accent); }
.note .meta { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.note blockquote { margin: 4px 0; padding: 4px 8px; background: var(--quote); border-radius: 4px;
  font: 13.5px/1.5 var(--read); white-space: pre-wrap; }
.note .body { white-space: pre-wrap; }
.note.reply { margin-left: 18px; }
.note.reply button { margin-top: 6px; }
.composer { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 70px; font: 14px/1.45 var(--ui); padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--bg); color: var(--fg); resize: vertical; }
.composer .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.composer .row .hint { color: var(--muted); font-size: 11.5px; margin-right: auto; }
[hidden] { display: none !important; }   /* else #tool's and #hmenu's display: flex keeps them on screen */
#tool, #hmenu { position: absolute; z-index: 10; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.empty { color: var(--muted); font-size: 12.5px; padding: 3px 6px; }
.keys { color: var(--muted); font-size: 11.5px; margin-top: 18px; line-height: 1.7; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
.tx-comment { color: var(--muted); font-style: italic; }
.tx-cite, .tx-ref { color: var(--accent); }
.tx-env { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.tx-code { font: 13px var(--mono); }
.tx-textsc { font-variant: small-caps; }
.tx-hidden { display: none; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
</head>
<body>
<header>
  <h1>Review</h1>
  <span class="meta" id="meta"></span>
  <span id="progress"></span>
  <span class="meta" id="spent"></span>
  <span class="grow"></span>
  <label><input type="checkbox" id="tex" checked> Render LaTeX</label>
  <label><input type="checkbox" id="only" checked> Changes only</label>
</header>
<div class="layout">
  <nav id="side"></nav>
  <main id="doc" class="changes-only"></main>
</div>
<div id="tool" hidden>
  <button data-act="comment">Comment</button>
  <button data-act="context" id="ctxbtn">Contextualize</button>
</div>
<div id="hmenu" hidden>
  <button data-h="approve_edit" class="primary">Approve edit</button>
  <button data-h="approve">Approve</button>
  <button data-h="revert">Revert</button>
  <button data-h="comment">Comment</button>
</div>
<script>
const H = { "Content-Type": "application/json", "X-Review": "1" };
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: H, body: JSON.stringify(body) } : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
const $ = (s, el = document) => el.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

let info, doc, log = [], version = null, logLen = -1, cur = -1, pending = null;
let changed = [];        // changed passages in reading order
let S = {};              // state derived from the log
const inflight = new Set();  // contextualize requests still running

function derive() {
  S = { approved: new Set(), hunks: new Set(), comments: [], replies: {}, dismissed: new Set(), commits: {}, editOf: {}, contexts: [], spent: 0, open: [], asked: [] };
  for (const e of log) {
    if (e.type === "approve") S.approved.add(e.passage);
    if (e.type === "unapprove") S.approved.delete(e.passage);
    // A hunk's approval is keyed by its text, so it survives edits elsewhere in the passage.
    if (e.type === "approve_hunk") S.hunks.add(hkey(e.file, e.old, e.new));
    if (e.type === "unapprove_hunk") S.hunks.delete(hkey(e.file, e.old, e.new));
    if (e.type === "comment") S.comments.push(e);
    if (e.type === "reply") { (S.replies[e.to] ||= []).push(e); S.spent += e.cost || 0; }
    if (e.type === "dismiss") S.dismissed.add(e.to);
    // An edit's hunks; a hunk belongs to the latest edit that produced it.
    if (e.type === "edit") for (const [o, n] of e.hunks) S.editOf[hkey(e.file, o, n)] = e.id;
    if (e.type === "commit") { S.commits[e.passage] = e; S.spent += e.cost || 0; }
    if (e.type === "context") { S.contexts.push(e); S.spent += e.cost || 0; }
  }
  S.open = S.comments.filter(e => !S.replies[e.id]);
  // Answered without an edit (a question, a refusal, a failure): shown until dismissed.
  S.asked = S.comments.filter(e => S.replies[e.id]?.at(-1).edited === false && !S.dismissed.has(e.id));
}

// The passage a note belongs to. Editing a passage changes its id, so a note
// whose passage is gone follows its file and line to the passage there now.
function home(e) {
  if (changed.some(p => p.id === e.passage)) return e.passage;
  const ps = changed.filter(p => p.file === e.file);
  if (!ps.length) return null;
  const hit = ps.find(p => e.line >= p.start && e.line <= p.end);
  return (hit || ps.reduce((a, b) => Math.abs(b.start - e.line) < Math.abs(a.start - e.line) ? b : a)).id;
}

const where = p => `${p.file.split("/").pop()}:${p.start === p.end ? p.start : p.start + "–" + p.end}`;
const newText = p => p.segs.filter(s => s[0] !== "-").map(s => s[1]).join("");
const gist = p => p.segs.filter(s => s[0] !== "-").map(s => s[1]).join("").replace(/\s+/g, " ").trim().slice(0, 80);

function renderDoc() {
  const main = $("#doc"); main.replaceChildren();
  changed = [];
  for (const f of doc.files) {
    const sec = el("section", { class: "file" }, el("h2", {}, f.path));
    for (const p of f.passages) {
      if (p.kind === "same") { sec.append(el("div", { class: "same" }, tex(p.segs[0][1]))); continue; }
      changed.push(p);
      // Each run of changes is a hunk, numbered as review.py's hunks() numbers it.
      const text = el("div", { class: "text" });
      let h = null; p.hs = [];
      // A hunk changed since its approval shows the change since: its parts carry
      // `sub` (review.py since_approved()).
      for (const [o, t, s] of p.segs) {
        if (o === "=") { h = null; text.append(tex(t)); continue; }
        if (!h) { h = el("span", { class: "hunk" }); h.k = p.hs.length; p.hs.push(h); h.old = h.neu = ""; h.sub = p.subs?.[s]; text.append(h); }
        // A paragraph break removed or added shows as a marked ¶, not as blank lines.
        const brk = /^\s*\n\s*\n\s*$/.test(t);
        if (o === "-") { h.old += t; h.append(el("del", brk ? { title: "paragraph break removed" } : {}, brk ? " ¶ " : tex(t))); }
        else { h.neu += t; brk ? h.append(el("ins", { class: "mark", title: "paragraph break added" }, " ¶"), t) : h.append(el("ins", {}, tex(t))); }
      }
      const card = el("article", { class: "card", id: "p-" + p.id },
        el("div", { class: "head" },
          el("span", { class: "where" }, `${p.file}:${p.start === p.end ? p.start : p.start + "–" + p.end}`),
          el("span", { class: "gist" }, p.segs.filter(([o]) => o !== "-").map(([, t]) => t).join("").replace(/\s+/g, " ").slice(0, 160)),
          el("button", { "data-act": "note" }, "Comment"),
          newText(p).trim().includes("\n") ? el("button", { "data-act": "split", title: "Cut this passage in 2 at the line nearest its middle" }, "Split in half") : null,
          el("button", { "data-act": "approve" }, "Approve")),
        text, el("div", { class: "thread" }));
      card.passage = p;
      sec.append(card);
    }
    if (sec.children.length > 1) main.append(sec);
  }
  renderState();
}

// LaTeX shown as the PDF would print it. Every rendered piece keeps its source
// in data-src, so a selection quotes the source (srcText) and lines still count.
let refsData = { cites: {}, labels: {} }, texOn = true;
const TEX = /(%[^\n]*)|\$([^$]+)\$|\\(cite[a-z]*)\*?(?:\[[^\]]*\])*\{([^{}]*)\}|\\(ref|autoref|cref|eqref)\{([^{}]*)\}|\\label\{[^{}]*\}|\\(path|url|texttt)\{([^{}]*)\}|\\(textbf|emph|textit|textsc)\{([^{}]*)\}|\\(begin|end)\{([^{}]*)\}((?:\{[^{}]*\}|\[[^\]]*\])*)|\\\\|\\([%&_#$,;! {}])|~|``|''|\\(item|hline|centering|toprule|midrule|bottomrule|addlinespace|noindent)(?![a-zA-Z])/g;
function tex(str) {
  if (!texOn) return document.createTextNode(str);
  const f = document.createDocumentFragment();
  let last = 0;
  for (const m of str.matchAll(TEX)) {
    if (m.index > last) f.append(str.slice(last, m.index));
    f.append(texNode(m));
    last = m.index + m[0].length;
  }
  if (last < str.length) f.append(str.slice(last));
  return f;
}
function texNode(m) {
  const src = m[0];
  const node = (tag, cls, txt, title) => {
    const e = el(tag, { class: cls, "data-src": src }, txt);
    if (title) e.title = title;
    return e;
  };
  if (m[1] != null) return node("span", "tx-comment", m[1]);
  if (m[2] != null) {
    const e = node("span", "tx-math", m[2]);
    try { katex.render(m[2], e, { throwOnError: false }); } catch (_) { /* no KaTeX: the source shows */ }
    return e;
  }
  if (m[3]) {
    const ks = m[4].split(",").map(k => k.trim()), c = ks.map(k => refsData.cites[k]);
    return node("span", "tx-cite", "[" + ks.map((k, i) => c[i]?.short || k).join("; ") + "]",
      ks.map((k, i) => c[i]?.title || k).join("\n"));
  }
  if (m[5]) {
    const n = refsData.labels[m[6]];
    return node("span", "tx-ref", n ? (m[5] === "eqref" ? `(${n})` : n) : "??", m[6]);
  }
  if (m[7]) return node("code", "tx-code", m[8]);
  if (m[9]) return node({ textbf: "b", emph: "i", textit: "i", textsc: "span" }[m[9]], "tx-" + m[9], m[10]);
  if (m[11]) return node("span", "tx-env", `${m[11] === "begin" ? "▸" : "◂"} ${m[12]}`);
  if (m[14]) return node("span", "", { ",": " ", ";": " ", "!": "" }[m[14]] ?? m[14]);
  if (src === "~") return node("span", "", " ");
  if (src === "``") return node("span", "", "“");
  if (src === "''") return node("span", "", "”");
  return node("span", "tx-hidden", "");   // \label, \\, layout commands
}
function srcText(frag) {
  frag.querySelectorAll("del").forEach(d => d.remove());
  frag.querySelectorAll("[data-src]").forEach(e => e.replaceWith(e.dataset.src));
  return frag.textContent;
}

function note(who, e, cls = "") {
  const n = el("div", { class: "note " + cls },
    el("span", { class: "who" + (who === "Claude" ? " claude" : "") }, who),
    el("span", { class: "meta" }, e.ts.slice(5, 16) + (e.model ? ` · ${e.model.replace("claude-", "")}` : "") + (e.cost != null ? ` · $${e.cost.toFixed(3)}` : "")));
  if (e.quote) n.append(el("blockquote", {}, e.quote));
  n.append(el("div", { class: "body" }, e.text));
  return n;
}

function waiting(q) {
  return el("div", { class: "note" }, el("span", { class: "who claude" }, "Context"),
    el("span", { class: "meta" }, `${info.model} is reading the repo…`), el("blockquote", {}, q.quote));
}

function renderState() {
  const threads = {};
  for (const p of changed) threads[p.id] = $(".thread", document.getElementById("p-" + p.id));
  for (const th of Object.values(threads)) th.replaceChildren();
  // Only comments still waiting for Claude show; answered ones are done with.
  for (const c of S.open) {
    const n = note("You", c);
    if (info.worker) n.children[1].append(" · on it…");
    threads[home(c)]?.append(n);
  }
  for (const c of S.asked) {
    const th = threads[home(c)];
    if (!th) continue;
    th.append(note("You", c));
    const r = note("Claude", S.replies[c.id].at(-1), "reply");
    r.append(el("div", {}, el("button", { "data-act": "dismiss", "data-id": c.id }, "Dismiss")));
    th.append(r);
  }
  for (const c of S.contexts) threads[home(c)]?.append(note("Context", c));
  for (const q of inflight) threads[home(q)]?.append(waiting(q));
  for (const p of changed) {
    const card = document.getElementById("p-" + p.id);
    const ok = pOk(p), cm = S.commits[p.id];
    card.classList.toggle("ok", ok);
    const b = $('[data-act="approve"]', card);
    // Approving a passage commits its uncommitted edits (review.py commit()).
    b.textContent = !ok ? "Approve" : cm?.sha ? `Committed ${cm.sha}` : S.approved.has(p.id) && !cm ? "Committing…" : "Approved";
    b.classList.toggle("approved", ok);
    card.classList.toggle("done", !!(ok && cm?.sha));   // committed: collapsed to its head
    if (cm?.error && S.approved.has(p.id)) threads[p.id].append(note("Commit failed", { ts: cm.ts, text: cm.error }));
    for (const h of p.hs) {
      const ok = hunkOk(p, h);
      h.classList.toggle("ok", ok);
      h.title = ok ? "" : "Approve, revert or comment";
    }
  }
  const done = changed.filter(pOk).length;
  $("#progress").textContent = `${done} / ${changed.length} approved · ${S.open.length} open comment${S.open.length === 1 ? "" : "s"}`;
  $("#spent").textContent = info.has_key ? `API credits spent: $${S.spent.toFixed(2)}` : "Contextualize off: no API key";
  renderSide();
}

function renderSide() {
  const side = $("#side"); side.replaceChildren();
  side.append(el("h2", {}, "Open comments"));
  if (!S.open.length) side.append(el("div", { class: "empty" }, "None"));
  for (const c of S.open) {
    const a = el("a", { href: "#p-" + home(c) }, el("span", { class: "dot open" }),
      el("span", { class: "where" }, `${c.file.split("/").pop()}:${c.line}`), el("span", { class: "gist" }, c.text));
    side.append(a);
  }
  let file = null;
  for (const [i, p] of changed.entries()) {
    if (p.file !== file) { file = p.file; side.append(el("h2", {}, file)); }
    const state = S.open.some(c => home(c) === p.id) ? "open" : pOk(p) ? "ok" : "";
    const a = el("a", { href: "#p-" + p.id, class: i === cur ? "cur" : "" }, el("span", { class: "dot " + state }),
      el("span", { class: "where" }, where(p)), el("span", { class: "gist" }, gist(p)));
    a.onclick = ev => { ev.preventDefault(); focusCard(i); };
    side.append(a);
  }
  side.append(el("div", { class: "keys" },
    el("kbd", {}, "j"), " / ", el("kbd", {}, "k"), " next / previous change · ",
    el("kbd", {}, "a"), " approve · ", el("kbd", {}, "c"), " comment on the passage · select text to comment or contextualize"));
}

function focusCard(i) {
  if (i < 0 || i >= changed.length) return;
  document.querySelector(".card.cur")?.classList.remove("cur");
  cur = i;
  const card = document.getElementById("p-" + changed[i].id);
  card.classList.add("cur");
  card.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  renderSide();
}

function lineOf(p, range) {
  // Line of the selection start within the passage's new text.
  const pre = document.createRange();
  pre.selectNodeContents($(".text", document.getElementById("p-" + p.id)));
  pre.setEnd(range.startContainer, range.startOffset);
  return p.start + (srcText(pre.cloneContents()).match(/\n/g) || []).length;
}

function openComposer(card, quote, line, draft = "") {
  $(".composer", card)?.remove();
  const ta = el("textarea", { placeholder: "Prompt for Claude: what should change, or what to check" });
  ta.value = draft;
  // One send button per model; the first (Sonnet) is the default and takes ⌘/Ctrl+Enter.
  const models = Object.entries(info.models || { Claude: info.model });
  const sends = models.map(([name, id], i) => {
    const b = el("button", i ? {} : { class: "primary" }, `Send to ${name}`);
    b.onclick = () => submit(id);
    return b;
  });
  const cancel = el("button", {}, "Cancel");
  const box = el("div", { class: "composer" }, quote ? el("blockquote", {}, quote) : null, ta,
    el("div", { class: "row" }, el("span", { class: "hint" }, `⌘/Ctrl+Enter sends to ${models[0][0]} · Esc to cancel`),
      cancel, ...sends.reverse()));
  box.meta = { quote, line };
  $(".text", card).after(box);
  ta.focus();
  const p = card.passage;
  const submit = async model => {
    if (!ta.value.trim()) return;
    sends.forEach(b => b.disabled = true);
    try {
      const e = await api("/api/log", { type: "comment", passage: p.id, file: p.file, line, quote, model, text: ta.value.trim() });
      log.push(e); logLen++; derive(); renderState(); box.remove();
    } catch (err) { sends.forEach(b => b.disabled = false); alertIn(box, err); }
  };
  cancel.onclick = () => box.remove();
  ta.onkeydown = ev => {
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) submit(models[0][1]);
    if (ev.key === "Escape") box.remove();
  };
}

function alertIn(box, err) {
  box.append(el("div", { class: "note" }, el("span", { class: "who" }, "Error"), String(err.message || err)));
}

async function contextualize(card, quote, line) {
  const p = card.passage;
  const q = { passage: p.id, file: p.file, line, quote };
  inflight.add(q); renderState();
  try {
    const e = await api("/api/contextualize", q);
    inflight.delete(q); log.push(e); logLen++; derive(); renderState();
  } catch (err) {
    inflight.delete(q); renderState();
    const th = $(".thread", document.getElementById("p-" + home(q)) || card);
    alertIn(th, err);
  }
}

// Selection toolbar: appears for a selection inside one passage's text.
const tool = $("#tool");
function selectionInCard() {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0).cloneRange();
  const boxOf = n => (n.nodeType === 1 ? n : n.parentElement)?.closest(".text");
  const box = boxOf(range.startContainer) || boxOf(range.endContainer);
  if (!box) return null;
  // A selection dragged past the passage's edge, or a triple-click, is cut back
  // to the passage it starts in, and the highlight shows what will be quoted.
  const cut = !box.contains(range.startContainer) || !box.contains(range.endContainer);
  if (!box.contains(range.startContainer)) range.setStart(box, 0);
  if (!box.contains(range.endContainer)) range.setEnd(box, box.childNodes.length);
  if (cut) { sel.removeAllRanges(); sel.addRange(range); }
  const quote = srcText(range.cloneContents()).trim();
  const card = box.closest(".card");
  return quote ? { card, quote, line: lineOf(card.passage, range), range } : null;
}
function updateTool() {
  pending = selectionInCard();
  if (!pending) { tool.hidden = true; return; }
  const r = pending.range.getBoundingClientRect();
  tool.style.left = Math.max(8, Math.min(r.left + scrollX, innerWidth - 220)) + "px";
  tool.style.top = (r.bottom + scrollY + 6) + "px";
  hideMenu(); tool.hidden = false;
}
// Mouse selections settle on mouseup; keyboard ones (shift+arrows) on selectionchange.
// Any press outside the two bars closes both; a plain click (no drag, single
// click) never opens the selection bar, even if a selection survives it.
let mouseDown = false, settle, downAt = null;
document.addEventListener("mousedown", ev => {
  if (tool.contains(ev.target) || hmenu.contains(ev.target)) return;
  hideMenu(); tool.hidden = true; pending = null;
  mouseDown = true; downAt = [ev.clientX, ev.clientY];
});
document.addEventListener("mouseup", ev => {
  if (!mouseDown) return;
  mouseDown = false;
  const moved = downAt && Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 3;
  if (moved || ev.detail > 1) setTimeout(updateTool);
});
document.addEventListener("selectionchange", () => {
  if (mouseDown) return;
  clearTimeout(settle); settle = setTimeout(updateTool, 150);
});
tool.addEventListener("mousedown", ev => ev.preventDefault());
tool.addEventListener("click", ev => {
  const act = ev.target.dataset.act;
  if (!act || !pending) return;
  tool.hidden = true;
  const { quote, line } = pending;
  // The card may have been re-rendered since the selection: use the one there now.
  const p = pending.card.passage;
  const card = pending.card.isConnected ? pending.card
    : document.getElementById("p-" + home({ passage: p.id, file: p.file, line }));
  pending = null;
  getSelection().removeAllRanges();
  if (!card) return;
  act === "comment" ? openComposer(card, quote, line) : contextualize(card, quote, line);
});

// One hunk's menu: approve it, put the old text back, or comment on it.
const hmenu = $("#hmenu");
let menuFor = null;
const hkey = (file, old, neu) => file + "\0" + old + "\0" + neu;
// The key that approves a hunk whole: for a part of a change since approval, the whole change.
const full = h => h.sub ? [h.sub.old, h.sub.new] : [h.old, h.neu];
const hOk = (p, h) => S.hunks.has(hkey(p.file, ...full(h)));
const hunkOk = (p, h) => S.approved.has(p.id) || hOk(p, h);
// A passage is approved as a whole, or by approving each of its hunks.
const pOk = p => !!p && (S.approved.has(p.id) || p.hs.every(h => hOk(p, h)));
// Clear a passage's approval and its hunks'.
async function unapprove(p) {
  const at = { passage: p.id, file: p.file, line: p.start };
  if (S.approved.has(p.id)) await post({ ...at, type: "unapprove" });
  for (const h of p.hs) if (hOk(p, h)) await post({ ...at, type: "unapprove_hunk", old: full(h)[0], new: full(h)[1] });
}
// Approve hunks. The parts of one change shown against its approved text (`sub`:
// a split or an edit since approval) approve together: that text with those parts
// applied replaces it. True when the page must reload to show the result.
async function approveAll(hs) {
  const groups = new Map();
  for (const x of hs) {
    const q = x.closest(".card").passage, at = { passage: q.id, file: q.file, line: q.start };
    if (hOk(q, x)) continue;
    if (!x.sub) { await post({ ...at, type: "approve_hunk", old: x.old, new: x.neu }); continue; }
    const k = hkey(q.file, x.sub.old, x.sub.new);
    if (!groups.has(k)) groups.set(k, { at, sub: x.sub, parts: new Set() });
    groups.get(k).parts.add(x.sub);
  }
  for (const { at, sub, parts } of groups.values()) {
    let t = sub.prev;
    for (const s of [...parts].sort((a, b) => b.a - a.a)) t = t.slice(0, s.a) + s.ins + t.slice(s.b);
    await post({ ...at, type: "approve_hunk", old: sub.old, new: t });
    if (S.hunks.has(hkey(at.file, sub.old, sub.prev))) await post({ ...at, type: "unapprove_hunk", old: sub.old, new: sub.prev });
  }
  return groups.size > 0;
}
function hideMenu() { hmenu.hidden = true; document.querySelectorAll(".hunk.on").forEach(x => x.classList.remove("on")); menuFor = null; }
// The hunks on the page that came from the same edit as h.
function editMates(h) {
  const p = h.closest(".card").passage, id = S.editOf[hkey(p.file, ...full(h))];
  if (!id) return [h];
  return [...document.querySelectorAll(".hunk")].filter(x => {
    const q = x.closest(".card").passage;
    return S.editOf[hkey(q.file, ...full(x))] === id;
  });
}
function openMenu(h) {
  hideMenu();
  tool.hidden = true; pending = null;
  menuFor = h;
  // Outline the whole edit this hunk came from; one click approves all of it.
  const mates = editMates(h), open = mates.filter(x => !hunkOk(x.closest(".card").passage, x));
  mates.forEach(x => x.classList.add("on"));
  const ae = $('[data-h="approve_edit"]', hmenu);
  ae.hidden = open.length < 2;
  ae.textContent = `Approve edit (${open.length})`;
  $('[data-h="revert"]', hmenu).disabled = false;
  const rs = h.getClientRects(), r = rs[rs.length - 1];
  hmenu.style.left = Math.max(8, Math.min(r.left + scrollX, innerWidth - 240)) + "px";
  hmenu.style.top = (r.bottom + scrollY + 6) + "px";
  hmenu.hidden = false;
}
async function post(e) { e = await api("/api/log", e); log.push(e); logLen++; derive(); }
hmenu.addEventListener("mousedown", ev => ev.preventDefault());
hmenu.addEventListener("click", async ev => {
  const act = ev.target.dataset.h, h = menuFor;
  if (!act || !h) return;
  const card = h.closest(".card"), p = card.passage, at = { passage: p.id, file: p.file, line: p.start };
  if (act === "comment") {
    hideMenu();
    const r = document.createRange(); r.setStart(h, 0);
    return openComposer(card, h.neu.trim() || "deleted: " + h.old.trim(), lineOf(p, r));
  }
  if (act === "approve_edit" || act === "approve") {
    const reload = await approveAll(act === "approve" ? [h] : editMates(h));
    hideMenu(); return reload ? loadDoc(true) : renderState();
  }
  if (act === "revert") {
    ev.target.disabled = true;
    try {
      const e = await api("/api/revert", { passage: p.id, file: p.file, hunk: h.k });
      log.push(e); logLen++;
      hideMenu(); await loadDoc(true);
    } catch (err) { hideMenu(); alertIn($(".thread", card), err); if (/changed/.test(err.message)) loadDoc(true); }
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape" || ev.target.closest("textarea")) return;
  hideMenu(); tool.hidden = true; pending = null; getSelection().removeAllRanges();
});

$("#doc").addEventListener("click", async ev => {
  const h = ev.target.closest(".hunk");
  if (h && !h.classList.contains("ok") && getSelection().isCollapsed) return openMenu(h);
  const done = ev.target.closest(".card.done");
  if (done && ev.target.closest(".where, .gist")) return done.classList.toggle("open");
  const act = ev.target.dataset.act;
  const card = ev.target.closest(".card");
  if (!act || !card) return;
  const p = card.passage;
  if (act === "note") openComposer(card, "", p.start);
  if (act === "dismiss") { await post({ type: "dismiss", to: ev.target.dataset.id, passage: p.id, file: p.file, line: p.start }); renderState(); }
  if (act === "approve") {
    if (pOk(p)) { await unapprove(p); return renderState(); }
    const reload = await approveAll(p.hs);
    await post({ type: "approve", passage: p.id, file: p.file, line: p.start });
    reload ? loadDoc(true) : renderState();
  }
  if (act === "split") {
    // At the line start nearest the middle of the passage's text.
    const lines = newText(p).split("\n"), half = newText(p).length / 2;
    let best = 0, at = 0;
    lines.forEach((l, k) => {
      if (k && l.trim() && (!best || Math.abs(at - half) < Math.abs(best[1] - half))) best = [k, at];
      at += l.length + 1;
    });
    if (!best) return;
    await post({ type: "split", passage: p.id, file: p.file, line: p.start + best[0], text: lines[best[0]] });
    loadDoc(true);
  }
});

document.addEventListener("keydown", ev => {
  if (ev.target.closest("textarea, input") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "j") focusCard(cur + 1);
  if (ev.key === "k") focusCard(Math.max(0, cur - 1));
  const card = cur >= 0 && document.getElementById("p-" + changed[cur]?.id);
  if (ev.key === "a" && card) $('[data-act="approve"]', card).click();
  if (ev.key === "c" && card) { ev.preventDefault(); openComposer(card, "", changed[cur].start); }
});

try { texOn = localStorage.getItem("review-tex") !== "0"; } catch (_) {}
$("#tex").checked = texOn;
$("#tex").onchange = ev => {
  texOn = ev.target.checked;
  try { localStorage.setItem("review-tex", texOn ? "1" : "0"); } catch (_) {}
  loadDoc(true);
};
$("#only").onchange = ev => $("#doc").classList.toggle("changes-only", ev.target.checked);

// Locate a card after a re-render: by id, or, when its text (and so its id)
// changed, by its position among the changed passages.
const findCard = (id, idx) => document.getElementById("p-" + id) || (changed[idx] && document.getElementById("p-" + changed[idx].id));

// The reader is selecting text: re-rendering now would drop the selection.
const selecting = () => {
  const sel = getSelection();
  return mouseDown || !tool.hidden || !hmenu.hidden || (sel.rangeCount > 0 && !sel.isCollapsed && $("#doc").contains(sel.anchorNode));
};

async function loadDoc(force = false) {
  const d = await api("/api/doc");   // first: it logs the edits the log must then include
  const [l, s, r] = await Promise.all([api("/api/log"), api("/api/state"), api("/api/refs")]);
  refsData = r;
  if (!force && selecting()) return;   // try again at the next poll
  // Keep what the reader is doing across the re-render: the card at the top of
  // the screen and its offset, the focused card, and any comment being written.
  const cards = [...document.querySelectorAll(".card")];
  const top = cards.find(c => c.getBoundingClientRect().bottom > 60);
  const anchor = top && { id: top.passage.id, idx: changed.indexOf(top.passage), y: top.getBoundingClientRect().top };
  const focus = cur >= 0 && changed[cur] ? { id: changed[cur].id, idx: cur } : null;
  const drafts = [...document.querySelectorAll(".composer")].map(b => {
    const ta = $("textarea", b), p = b.closest(".card").passage;
    return { id: p.id, idx: changed.indexOf(p), ...b.meta, text: ta.value,
             focused: document.activeElement === ta, sel: [ta.selectionStart, ta.selectionEnd] };
  });
  const before = new Set(changed.map(p => p.id));

  doc = d; log = l; version = s.version; logLen = log.length;
  derive(); renderDoc();

  if (before.size) for (const p of changed) if (!before.has(p.id)) document.getElementById("p-" + p.id).classList.add("fresh");
  if (focus) { const c = findCard(focus.id, focus.idx); if (c) { cur = changed.indexOf(c.passage); c.classList.add("cur"); renderSide(); } }
  for (const d of drafts) {
    const c = findCard(d.id, d.idx);
    if (!c) continue;
    openComposer(c, d.quote, d.line, d.text);
    const ta = $(".composer textarea", c);
    if (d.focused) ta.setSelectionRange(...d.sel); else ta.blur();
  }
  if (anchor) { const c = findCard(anchor.id, anchor.idx); if (c) scrollBy(0, c.getBoundingClientRect().top - anchor.y); }
}

let loading = false;
async function poll() {
  if (loading) return;
  loading = true;
  try {
    const s = await api("/api/state");
    if (s.version !== version && !selecting()) await loadDoc();
    else if (s.log !== logLen) { log = await api("/api/log"); logLen = log.length; derive(); renderState(); }
  } catch (_) { /* server restarting: try again next tick */ }
  loading = false;
}

(async () => {
  info = await api("/api/info");
  $("#meta").textContent = `${info.repo.split("/").pop()} vs ${info.base}`;
  const b = $("#ctxbtn");
  if (!info.has_key) { b.disabled = true; b.title = `No API key: add one to the Keychain service "${info.service}"`; }
  else b.title = `Runs /contextualize on ${info.model} with your API credits`;
  await loadDoc(true);
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
