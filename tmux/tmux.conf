# -----------------------------------------------------------------------------
# 1. INITIAL SETUP & RESET
# -----------------------------------------------------------------------------
# Load the reset file to clear/overwrite default keybindings
source-file ~/.config/tmux/tmux.reset.conf
set -g @tpm_plugins_variable_path '~/.config/tmux/plugins'
set -g mouse on

# -----------------------------------------------------------------------------
# 2. TERMINAL & COLORS
# -----------------------------------------------------------------------------
# Ensure colors display correctly (256 color support)
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g default-terminal "${TERM}"

# -----------------------------------------------------------------------------
# 3. GLOBAL OPTIONS
# -----------------------------------------------------------------------------
set -g prefix ^B                 # Set Prefix to Ctrl+B (Standard)
set -g base-index 1              # Start window numbering at 1 (not 0)
set -g detach-on-destroy off     # Switch to another session when one is closed
set -g escape-time 0             # Eliminate delay for Vim users
set -g focus-events on           # Pass focus events through to apps (needed for Neovim autoread)
set -g history-limit 1000000     # Massive scrollback buffer
set -g renumber-windows on       # Automatically re-index 1, 2, 3 when a window is closed
set -g set-clipboard on          # Allow tmux to push to system clipboard
set -g status-position top       # Move the status bar to the top of the screen
setw -g mode-keys vi             # Use Vim keys in copy mode (scroll mode)

# Style the borders between panes
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# -----------------------------------------------------------------------------
# 4. PLUGIN MANAGER (TPM) & BASIC PLUGINS
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'        # The Plugin Manager itself
set -g @tpm_plugins_variable_path '~/.config/tmux/plugins/' # specify tmux plugin folder

# 2. Fix the initialization line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'     # Copy to system clipboard with 'y'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save sessions through reboot
set -g @resurrect-strategy-nvim 'session'    # Restore Neovim sessions too
set -g @resurrect-dir '~/.config/tmux/resurrect' # Set the save directory for tmux-resurrect
# Press Prefix + S to purge numeric sessions and then save the rest
bind-key S run-shell 'tmux list-sessions -F "#{session_name}" | grep -E "^[0-9]+$" | xargs -I {} tmux kill-session -t {}; ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'

# -----------------------------------------------------------------------------
# 5. NAVIGATION & UTILITY PLUGINS
# -----------------------------------------------------------------------------
# prefix + b, space (it will highlight IP addresses and useful strings)
set -g @plugin 'fcsonline/tmux-thumbs'  # Quick finger-navigation for hints

# prefix F to search with fzf among tmux specific entities (also clip boards)
set -g @plugin 'sainnhe/tmux-fzf'       # Use FZF to manage tmux

# prefix u to scan for URLs and open them
set -g @plugin 'wfxr/tmux-fzf-url'      # Open URLs from terminal via FZF

set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'

# Floating Terminal (Floax) settings
# opens a floating terminal with prefix p
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'p'                  # Toggle floating terminal with Prefix + p
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# Session Management (SessionX) settings
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'               # Open session manager with Prefix + o
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'       # Use zoxide for fuzzy folder jumping

# -----------------------------------------------------------------------------
# 6. LOOK & FEEL (CATPPUCCIN THEME)
# -----------------------------------------------------------------------------
set -g @plugin 'omerxx/catppuccin-tmux'

# Window styling: (Left-separator Window-Number Middle-Separator Window-Name Right-Separator)
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# Status bar styling: (Session on left, Directory on right)
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# -----------------------------------------------------------------------------
# 7. INITIALIZE TPM (Keep this at the very bottom)
# -----------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
